# Tells Prometheus (kube-prometheus-stack) to scrape demo-api's /metrics every 15s.
# The release label is what the stack's Prometheus selects ServiceMonitors by.
# Result in KubeOrbit → Metrics: request rate, latency and error rate per environment.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: demo-api
  labels:
    app.kubernetes.io/name: demo-api
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
