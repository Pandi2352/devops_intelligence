# Dev: ArgoCD app kubeorbit-demo-api-dev syncs this automatically.
# CI (kubeorbit-demo-api: kubeconfig + publish_argocd:dev) rewrites images[0] with yq on every main build.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kubeorbit-demo-dev

resources:
  - ../../base

configMapGenerator:
  - name: demo-api-config
    behavior: merge
    literals:
      - APP_ENV=dev
      - APP_MESSAGE=Hello from DEV
      - CHAOS_ENABLED=true

images:
  - name: demo-api
    newName: registry.gitlab.com/mvp.bose23/kubeorbit-demo-api
    newTag: not-built-yet
