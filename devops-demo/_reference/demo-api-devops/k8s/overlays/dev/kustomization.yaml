# Dev: deployed automatically by ArgoCD (argocd/demo-api-dev.yaml).
# CI (stage kubeconfig / publish_argocd) rewrites images[0] with yq on every main-branch build.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-dev

resources:
  - ../../base

configMapGenerator:
  - name: demo-api-config
    behavior: merge
    literals:
      - APP_ENV=dev
      - APP_MESSAGE=Hello from DEV
      - CHAOS_ENABLED=true

images:
  - name: demo-api
    newName: registry.gitlab.com/YOUR_GITLAB_GROUP/demo-api
    newTag: not-built-yet
