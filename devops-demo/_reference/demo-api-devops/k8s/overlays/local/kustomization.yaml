# Local lab: image built straight into Minikube, no registry or CI needed.
#   minikube image build -t demo-api:local ../demo-api
#   kubectl apply -k k8s/overlays/local
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-local

resources:
  - namespace.yaml
  - ../../base

configMapGenerator:
  - name: demo-api-config
    behavior: merge
    literals:
      - APP_ENV=local
      - APP_MESSAGE=Hello from your laptop cluster
      - CHAOS_ENABLED=true

images:
  - name: demo-api
    newName: demo-api
    newTag: local
