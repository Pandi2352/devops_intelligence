# Prod: two replicas, chaos endpoints off, synced manually in ArgoCD (argocd/demo-api-prod.yaml).
# CI updates images[0] only when someone clicks the manual publish_argocd:prod job.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-prod

resources:
  - ../../base
  - pdb.yaml

replicas:
  - name: demo-api
    count: 2

configMapGenerator:
  - name: demo-api-config
    behavior: merge
    literals:
      - APP_ENV=prod
      - APP_MESSAGE=Hello from PROD
      - CHAOS_ENABLED=false

images:
  - name: demo-api
    newName: registry.gitlab.com/YOUR_GITLAB_GROUP/demo-api
    newTag: not-built-yet
