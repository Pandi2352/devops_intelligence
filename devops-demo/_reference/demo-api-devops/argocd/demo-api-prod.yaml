# kubectl apply -f argocd/demo-api-prod.yaml
# No `automated` block: ArgoCD shows OutOfSync after a prod publish, and a person clicks Sync
# (in ArgoCD or KubeOrbit's ArgoCD GitOps page). That click is the production approval.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-api-prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: kubeorbit-demo
spec:
  project: default
  source:
    repoURL: https://gitlab.com/YOUR_GITLAB_GROUP/demo-api-devops.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
