# Only needed if demo-api-devops is PRIVATE. Copy to repo-secret.yaml (git-ignored), fill in, then:
#   kubectl apply -f argocd/repo-secret.yaml
# Use a GitLab project access token with the read_repository scope.
apiVersion: v1
kind: Secret
metadata:
  name: demo-api-devops-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://gitlab.com/YOUR_GITLAB_GROUP/demo-api-devops.git
  username: oauth2
  password: REPLACE_WITH_READ_REPOSITORY_TOKEN
