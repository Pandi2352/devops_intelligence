# kubectl apply -f argocd/demo-api-dev.yaml
# Dev syncs automatically: every commit CI makes to k8s/overlays/dev is deployed within ~3 minutes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-api-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: kubeorbit-demo
spec:
  project: default
  source:
    repoURL: https://gitlab.com/YOUR_GITLAB_GROUP/demo-api-devops.git
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
