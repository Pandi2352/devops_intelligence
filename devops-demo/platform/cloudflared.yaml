# Cloudflare Tunnel connector (cloudflared), the same Deployment DevOps Intelligence applies when you
# create a tunnel in Connectors → DNS → Tunnels. Use this file instead if you prefer to run it through
# GitOps (for example as an ArgoCD app). Routes (hostname → Service) are managed remotely in Cloudflare,
# so this file never changes when environments get hostnames.
#
# The token is a secret: never commit it. Create the Secret by hand (or with Sealed Secrets / External Secrets):
#   kubectl create namespace cloudflared
#   kubectl -n cloudflared create secret generic cloudflared-token --from-literal=token=<tunnel token>
# The tunnel token is shown in Cloudflare → Zero Trust → Networks → Tunnels → <tunnel> → Install connector.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
spec:
  replicas: 2 # two connectors: a restart or node drain does not drop the tunnel
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2024.12.2
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65532
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
